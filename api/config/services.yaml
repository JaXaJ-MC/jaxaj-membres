parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Filter/'       # instanciés dans les ressources (QueryParameter)
            - '../src/Doctrine/'     # type Doctrine et valeur Periode
            - '../src/Security/Utilisateur.php'  # construit depuis le jeton
