security:
    providers:
        # L'utilisateur est reconstruit à partir du jeton, sans base : compte, personne, droits.
        jeton:
            lexik_jwt:
                class: App\Security\Utilisateur

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: jeton
            jwt: ~

    access_control:
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
